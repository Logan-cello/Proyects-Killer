spring.application.name=hk-coordinator
server.port=8080

# Segundos sin heartbeat antes de marcar un agente como OFFLINE
hk.heartbeat.timeout-seconds=30
# Máximo de tareas activas (ASSIGNED / IN_PROGRESS) por agente
hk.agent.max-active-tasks=2

spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
